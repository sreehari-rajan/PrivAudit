services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: privaudit
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: privaudit
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - privaudit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privaudit -d privaudit"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  privaudit-postgres: